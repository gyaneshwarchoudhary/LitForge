services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: book-ai-api

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - uploads_data:/app/uploads

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: book-ai-worker

    command: celery -A app.core.celery_app.celery_app worker --loglevel=info

    volumes:
      - .:/app
      - uploads_data:/app/uploads

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  flower:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: book-ai-flower

    command: celery -A app.core.celery_app.celery_app flower --port=5555

    ports:
      - "5555:5555"

    env_file:
      - .env

    depends_on:
      redis:
        condition: service_started
      worker:
        condition: service_started

  redis:
    image: redis:7-alpine

    container_name: book-ai-redis

    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  postgres:

    image: postgres:16

    container_name: book-ai-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
  redis_data: