version: "3.9"

services:

  api:
    build:
      context: .
      dockerfile: dockerfile

    container_name: book-ai-api

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - uploads_data:/app/uploads

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

  postgres:

    image: postgres:16

    container_name: book-ai-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: book_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data: